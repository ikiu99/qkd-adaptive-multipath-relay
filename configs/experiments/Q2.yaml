# Q2 -- Stale controller state (thesis extension, package 2). Level: B.
# The SDN controller only receives pool telemetry every `interval` seconds;
# a share phi of each link's key is consumed locally and never reported
# (ETSI GS QKD 014-style neighbour keys, link authentication), so the
# controller's picture of the pools drifts between reports.
exp_id: Q2
topologies: [nsfnet, abilene]
placement: random
rho_A: 0.2
rho_values: [0.6, 1.3]
local_consumption_fraction: 0.2
intervals_s: [0.05, 0.1, 0.2, 0.5]
views: [frozen, shadow, calibrated]
methods: [Adaptive@0.5, B0+PA, B1+PA]
n_requests_per_seed: 150
seed_offset: 1000
n_seeds: 30
policy_overrides:
  eps_target: 0.5
  a_target: 0.8
  fallback: block
pool_overrides:
  capacity_seconds: 0.5
