# E4 -- Cost & blocking vs load (README Section 9). Level: B.
exp_id: E4
level: B
topology: nsfnet
rho_values: [0.1, 0.3, 0.6, 0.9, 1.3]
# +AC / +PA: pool-checked baseline variants (qkdmp.policies.admission),
# the fair-comparison follow-up to Phase 7. Adaptive@0.5: the same policy at
# eps_target=0.5 (a second operating point; experiments/level_b_common.py).
methods: [B0, B1, B2, B3, B0+AC, B1+AC, B2+AC, B3+AC, B0+PA, B1+PA, B2+PA, B3+PA, Adaptive, Adaptive@0.5]
n_seeds: 30
n_requests_per_seed: 80
policy_overrides:
  eps_target: 0.15
  a_target: 0.8
  fallback: block
# Default pool.capacity_seconds=3600 holds far more key material than an
# 80-request Level B batch can ever consume in the few simulated seconds
# such a batch spans, so blocking/failure never responds to rho at all
# under it -- see reports/PHASE_6_REPORT.md. Shrunk so pool scarcity can
# actually bind within this batch size, same fix as E9 (Phase 5).
pool_overrides:
  capacity_seconds: 0.5

